listener 9001
protocol websockets
allow_anonymous true
password_file /mosquitto/config/users
acl_file /mosquitto/config/reader.acl

connection jagakali-hivemq
address hivemq:1883
local_clientid private-ingest
local_username private-ingest
remote_clientid jagakali-web-feed
try_private false
start_type automatic
notifications false
